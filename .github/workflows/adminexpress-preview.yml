name: Adminexpress Preview QA

# Standalone Pages site in the existing public *pruebas* repository.
# Never updates Adminexpress main, its canonical Pages site or taxi production.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/adminexpress-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: adminexpress-preview-qa-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed Adminexpress Preview snapshot
        uses: actions/checkout@v4
        with:
          repository: jorge2610g/Adminexpress
          ref: 0a2b00e281105a054dfde3dc4b2d7770fb9f503e
          path: admin-src
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: admin-src
        run: flutter pub get

      - name: Compile isolated Adminexpress Preview
        working-directory: admin-src
        run: flutter build web --release --base-href /express-trinidad-pruebas/

      - name: Add QA marker and prevent indexing
        working-directory: admin-src
        run: |
          cat > build/web/qa-version.json <<'EOF'
          {
            "app": "Adminexpress Preview QA",
            "commit": "0a2b00e281105a054dfde3dc4b2d7770fb9f503e",
            "source": "jorge2610g/Adminexpress",
            "runtime_environment": "account_scoped",
            "canonical_production_untouched": true
          }
          EOF
          echo -e 'User-agent: *\\nDisallow: /' > build/web/robots.txt
          touch build/web/.nojekyll

      - name: Enable isolated GitHub Pages site
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload QA web bundle
        uses: actions/upload-pages-artifact@v4
        with:
          path: admin-src/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy standalone QA Pages
        id: deployment
        uses: actions/deploy-pages@v4
